# research/_metadata.yml
listing:
  - id: featured-listing
    contents: 
      - "research/*.qmd"
    type: grid
    sort: "date desc"
    categories: true
    # filter-ui: false
    # max-items: 6
    # fields: [title, date, author, categories]
    include:
      featured: true
  
  - id: all-listing
    contents:
      - "research/*.qmd"
    type: grid
    sort: "date desc"
    categories: true
    include:
      featured: false
